[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── 301 redirects — old URL → new URL (preserves SEO) ──────────────────────

# Room booking
[[redirects]]
  from = "/room-booking/"
  to = "/room-hire/"
  status = 301

[[redirects]]
  from = "/room-booking/rooms/"
  to = "/room-hire/"
  status = 301

[[redirects]]
  from = "/room-booking/catering/"
  to = "/room-hire/"
  status = 301

[[redirects]]
  from = "/room-booking/conferences/"
  to = "/room-hire/"
  status = 301

[[redirects]]
  from = "/room-booking/*"
  to = "/room-hire/"
  status = 301

# Community centre
