# Helpful services sub-pages
[[redirects]]
  from = "/helpful-services/mental-health/"
  to = "/helpful-services/"
  status = 301

[[redirects]]
  from = "/helpful-services/*"
  to = "/helpful-services/"
  status = 301

# Building project (no equivalent — send to home)
[[redirects]]
  from = "/building-project/"
  to = "/"
  status = 301

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
