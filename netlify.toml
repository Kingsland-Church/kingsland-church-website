[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old URL → New URL redirects (301 = permanent, preserves SEO)
[[redirects]]
  from = "/room-booking/"
  to = "/room-hire/"
  status = 301

[[redirects]]
  from = "/room-booking/*"
  to = "/room-hire/"
  status = 301

[[redirects]]
  from = "/communitycentre/"
  to = "/community-centre/"
  status = 301

[[redirects]]
  from = "/communitycentre/*"
  to = "/community-centre/"
  status = 301

[[redirects]]
  from = "/services/"
  to = "/church/services/"
  status = 301

[[redirects]]
  from = "/building-project/"
  to = "/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
